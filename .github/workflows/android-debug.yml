name: Android Debug Build

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Locate project folder
        run: |
          set -eu
          f=$(find . -maxdepth 2 -name capacitor.config.ts -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "capacitor.config.ts not found"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JS dependencies
        run: cd "$PROJECT_DIR" && npm install --no-audit --no-fund

      - name: Lint (tsc)
        run: cd "$PROJECT_DIR" && npm run lint

      - name: Background tests
        run: cd "$PROJECT_DIR" && npm run test:bg

      - name: Web build
        run: cd "$PROJECT_DIR" && npm run build

      - name: Add Android platform (only if missing)
        run: cd "$PROJECT_DIR" && if [ ! -d android ]; then npx cap add android; fi

      - name: Apply AXON overlay
        run: cd "$PROJECT_DIR" && bash scripts/apply-android-overlay.sh

      - name: Capacitor sync
        run: cd "$PROJECT_DIR" && npx cap sync android

      - name: Assemble debug APK
        run: cd "$PROJECT_DIR/android" && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: axon-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: ${{ env.PROJECT_DIR }}/package-lock.json
          if-no-files-found: warn
